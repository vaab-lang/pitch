[package]
name = "vaab-site-runner"
version = "0.1.0"
edition = "2021"
description = "Vaab playground runner — embeds the Vaab VM for /api/run"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local sibling checkout. For CI or standalone clone, switch to:
# vaab-syntax = { git = "https://github.com/vaab-lang/vaab" }
vaab-syntax = { path = "../../vaab/crates/vaab-syntax" }
vaab-types = { path = "../../vaab/crates/vaab-types" }
vaab-vm = { path = "../../vaab/crates/vaab-vm" }
