# Free-tier Docker deploys on Render (spins down after ~15 min idle).
# Dashboard: New → Blueprint → this repo, or connect and apply this file.
# https://render.com/docs/blueprint-spec
#
# Two services, two custom domains (Render custom-domain limit):
#   site → vaab.dev (landing, playground, todo demo at /tasks)
#   riff → riff.vaab.dev (package registry)

services:
  - type: web
    name: site
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP
        value: site

  - type: web
    name: riff
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP
        value: riff
